<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test de positionnement IAM</title>
<meta name="description" content="Test gratuit de 15 minutes pour savoir quel parcours de certification AWS vous convient : Cloud Foundations ou AI Foundations.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: une colonne de lecture (720px) — identité, questions groupées par domaine, puis résultat avec score par domaine et code à transmettre. */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --ink:#0E1726; --muted:#4B5565; --line:#DCE1E8; --line-strong:#B8C1CE;
  --band:#0E1726; --on-band:#FFFFFF; --on-band-muted:#C7CFDA;
  --cloud:#0B6E6E; --cloud-soft:#E3F1F1; --ai:#5B3CC4; --ai-soft:#EEEAFB;
  --accent-btn:#F2A33A; --on-accent:#0E1726; --focus:#C46A0A;
  --ok:#1D7A43; --ok-soft:#E3F3E9; --warn:#8A5A00; --warn-soft:#FBF0D9; --bad:#B42318; --bad-soft:#FCE7E5; --neutral-soft:#EEF1F5;
  --display:"Sora","Segoe UI",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B111C; --surface:#131C2B; --ink:#E7ECF3; --muted:#A3AEBE; --line:#253247; --line-strong:#3A4A63;
  --band:#060A12; --on-band:#FFFFFF; --on-band-muted:#A3AEBE;
  --cloud:#4CC2C0; --cloud-soft:#12302F; --ai:#A994F5; --ai-soft:#25204A; --focus:#F2A33A;
  --ok:#5FD08E; --ok-soft:#123222; --warn:#F2C062; --warn-soft:#33270E; --bad:#FF8A80; --bad-soft:#3A1715; --neutral-soft:#1C2737; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0B111C; --surface:#131C2B; --ink:#E7ECF3; --muted:#A3AEBE; --line:#253247; --line-strong:#3A4A63;
  --band:#060A12; --on-band:#FFFFFF; --on-band-muted:#A3AEBE;
  --cloud:#4CC2C0; --cloud-soft:#12302F; --ai:#A994F5; --ai-soft:#25204A; --focus:#F2A33A;
  --ok:#5FD08E; --ok-soft:#123222; --warn:#F2C062; --warn-soft:#33270E; --bad:#FF8A80; --bad-soft:#3A1715; --neutral-soft:#1C2737; color-scheme:dark;}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body)}
.band{background:var(--band);color:var(--on-band)}
.inner{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band .inner{padding-block:28px 32px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--on-band-muted)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:32px;line-height:1.15;letter-spacing:-.01em}
h2{font-size:20px}
.band p{margin:0;color:var(--on-band-muted);max-width:620px}
.tag{align-self:flex-start;display:inline-flex;gap:8px;align-items:center;font-weight:600;font-size:14px;padding:4px 12px;border-radius:999px;background:var(--track-soft);color:var(--track)}
main.inner{padding-block:28px 72px;display:flex;flex-direction:column;gap:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:15px;color:var(--muted)}
.facts b{color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:15px;font-weight:500;min-width:0}
label.f input{min-height:44px;border:1px solid var(--line-strong);border-radius:8px;padding:0 12px;background:var(--surface);color:var(--ink);font:inherit;width:100%;box-sizing:border-box}
.domain-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px}
.domain-head span{font-size:14px;color:var(--muted)}
fieldset.q{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;min-width:0}
fieldset.q legend{font-weight:600;padding:0;margin-bottom:8px;line-height:1.45}
.qn{font-family:var(--mono);font-size:13px;color:var(--muted);margin-right:6px;font-weight:500}
.opt{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;min-height:24px}
.opt:hover{border-color:var(--line-strong)}
.opt input{margin:3px 0 0;width:18px;height:18px;flex:0 0 18px;accent-color:var(--track)}
.opt:has(input:checked){border-color:var(--track);background:var(--track-soft)}
.qs{display:flex;flex-direction:column;gap:22px}
.btn{min-height:48px;padding:10px 22px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:600 16px var(--body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--accent-btn);border-color:var(--accent-btn);color:var(--on-accent)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn:focus-visible,.opt:has(input:focus-visible),label.f input:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.submit-row{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.progress{font-size:15px;color:var(--muted)}
.err{color:var(--bad);margin:0;font-weight:500}
.choose{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.choose a{display:flex;flex-direction:column;gap:8px;padding:22px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none}
.choose a:hover{border-color:var(--line-strong)}
.choose a strong{font-family:var(--display);font-size:20px}
.choose a span{color:var(--muted);font-size:15px}
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score .big{font-family:var(--display);font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score .of{color:var(--muted)}
.verdict{padding:14px 16px;border-radius:10px;font-weight:500}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.warn{background:var(--warn-soft);color:var(--warn)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr) 56px;gap:12px;align-items:center;font-size:15px}
.bar{height:10px;border-radius:999px;background:var(--neutral-soft);overflow:hidden}
.bar span{display:block;height:100%;background:var(--track);border-radius:999px}
.bar-row .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.code{font-family:var(--mono);font-size:13px;background:var(--neutral-soft);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-wrap:anywhere;user-select:all}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.hint{font-size:14px;color:var(--muted);margin:0}
@media (max-width:520px){.bar-row{grid-template-columns:minmax(0,1fr) 56px}.bar-row .bar{grid-column:1 / -1;grid-row:2}}
.topbar{background:#FFFFFF;border-bottom:1px solid #DCE1E8}
.topbar .inner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding-block:10px}
.topbar a{color:#0E1726;text-decoration:none}
.topbar .home{display:flex;align-items:center;gap:12px;min-height:44px;font:600 15px var(--display)}
.topbar .home img{height:40px;width:auto}
.topbar .back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border:1px solid #B8C1CE;border-radius:10px;font-weight:600;font-size:15px}
.topbar .back:hover{border-color:#0E1726}
.sitefoot{border-top:1px solid var(--line);margin-top:8px}
.sitefoot .inner{display:flex;flex-wrap:wrap;gap:8px 20px;padding-block:20px 32px;font-size:14px;color:var(--muted)}
.sitefoot a{color:var(--ink);font-weight:500}
</style>
</head>

    var t = TESTS[key], per = {}, ok = 0;
    Object.keys(t.domains).forEach(function(d){ per[d] = [0, 0]; });
    t.questions.forEach(function(q, i){ per[q[0]][1]++; if (answers[i] === q[3]) { per[q[0]][0]++; ok++; } });
    var pct = Math.round(ok / t.questions.length * 100);
    var r;
    if (key === "cloud") r = pct >= 60 ? "pret" : pct >= 40 ? "prep" : "bases";
    else {
      var cloudOk = per.cloud[0] / per.cloud[1] >= 2 / 3;
      r = pct >= 60 ? (cloudOk ? "pret" : "pret_cloud") : pct >= 40 ? "prep" : "cloud_first";
    }
    return { ok: ok, total: t.questions.length, pct: pct, per: per, r: r };
  }
  var VERDICTS = {
    pret: ["ok", "Vous avez le niveau pour démarrer le parcours."],
    pret_cloud: ["ok", "Vous avez le niveau pour démarrer AI Foundations. Prévoyez de revoir les notions Cloud avant la semaine 1 : le formateur vous indiquera les modules."],
    prep: ["warn", "Vous pouvez rejoindre le parcours, avec des modules préparatoires à suivre avant le démarrage. IAM vous les communiquera."],
    bases: ["bad", "Nous vous conseillons de renforcer vos bases en informatique et en anglais technique avant ce parcours. Un conseiller IAM vous recontactera pour en parler."],
    cloud_first: ["bad", "Nous vous conseillons de commencer par le parcours Cloud Foundations, puis de rejoindre AI Foundations à la promotion suivante."]
  };

  /* ---------- Écrans ---------- */
  function setBand(key){
    var root = document.documentElement.style;
    if (key) {
      var t = TESTS[key];
      root.setProperty("--track", "var(--" + key + ")"); root.setProperty("--track-soft", "var(--" + key + "-soft)");
      document.getElementById("title").textContent = "Test de positionnement · " + t.name;
      document.getElementById("lead").textContent = t.questions.length + " questions de connaissances de base pour préparer le parcours " + t.name + " (" + t.cert + "). Comptez 15 minutes environ.";
    } else {
      root.setProperty("--track", "var(--cloud)"); root.setProperty("--track-soft", "var(--cloud-soft)");
      document.getElementById("title").textContent = "Test de positionnement";
      document.getElementById("lead").textContent = "Choisissez le test qui correspond au parcours qui vous intéresse.";
    }
  }

  function renderChoose(){
    setBand(null);
    app.innerHTML = '<div class="choose">' +
      '<a href="#cloud"><strong style="color:var(--cloud)">Cloud Foundations</strong><span>Étudiants, reconversion, métiers non techniques. 15 questions : informatique, anglais technique, Cloud.</span></a>' +
      '<a href="#ai"><strong style="color:var(--ai)">AI Foundations</strong><span>Développeurs, data, chefs de projet, managers. 15 questions : informatique, anglais technique, Cloud, IA.</span></a>' +
      '</div><p class="hint">Vous hésitez ? Commencez par le test Cloud Foundations.</p>';
  }

  function renderTest(key){
    setBand(key);
    var t = TESTS[key];
    state.test = key; state.answers = {};
    var html = '<section class="card" aria-labelledby="who-h"><h2 id="who-h">Vos coordonnées</h2>' +
      '<div class="facts"><span><b>' + t.questions.length + '</b> questions</span><span><b>' + Object.keys(t.domains).length + '</b> domaines</span><span>Aucune question éliminatoire</span><span>Répondez seul, sans chercher les réponses</span></div>' +
      '<div class="grid2">' +
      '<label class="f">Nom complet<input id="w-nom" autocomplete="name" required value="' + esc(state.who.nom) + '"></label>' +
      '<label class="f">E-mail<input id="w-email" type="email" autocomplete="email" required value="' + esc(state.who.email) + '"></label>' +
      '<label class="f">Téléphone (WhatsApp)<input id="w-tel" type="tel" autocomplete="tel" placeholder="+221 …" value="' + esc(state.who.tel) + '"></label>' +
      '</div></section>';
    var n = 0;
    Object.keys(t.domains).forEach(function(d){
      var qs = t.questions.map(function(q, i){ return [q, i]; }).filter(function(x){ return x[0][0] === d; });
      html += '<section class="card" aria-labelledby="d-' + d + '"><div class="domain-head"><h2 id="d-' + d + '">' + esc(t.domains[d]) + '</h2><span>' + qs.length + ' questions</span></div><div class="qs">';
      qs.forEach(function(x){
        var q = x[0], i = x[1]; n++;
        html += '<fieldset class="q"><legend><span class="qn">' + String(n).padStart(2, "0") + '</span>' + esc(q[1]) + '</legend>' +
          q[2].map(function(o, j){ return '<label class="opt"><input type="radio" name="q' + i + '" id="q' + i + '-' + j + '" value="' + j + '"><span>' + esc(o) + '</span></label>'; }).join("") +
          '</fieldset>';
      });
      html += '</div></section>';
    });
    html += '<div class="submit-row"><span class="progress" id="progress" aria-live="polite">0 / ' + t.questions.length + ' réponses</span>' +
      '<button class="btn primary" type="button" id="submit">Voir mon résultat</button></div><p class="err" id="err" hidden></p>';
    app.innerHTML = html;
    app.querySelectorAll('input[type="radio"]').forEach(function(r){ r.addEventListener("change", function(){
      state.answers[Number(r.name.slice(1))] = Number(r.value);
      document.getElementById("progress").textContent = Object.keys(state.answers).length + " / " + t.questions.length + " réponses";
    }); });
    document.getElementById("submit").addEventListener("click", submit);
    window.scrollTo(0, 0);
  }

  function submit(){
    var t = TESTS[state.test], err = document.getElementById("err");
    var nom = document.getElementById("w-nom").value.trim(), email = document.getElementById("w-email").value.trim(), tel = document.getElementById("w-tel").value.trim();
    state.who = { nom: nom, email: email, tel: tel };
    var missing = t.questions.length - Object.keys(state.answers).length;
    if (!nom || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = "Indiquez votre nom et une adresse e-mail valide, en haut du test."; err.hidden = false; document.getElementById("w-nom").focus(); return; }
    if (missing > 0) { err.textContent = "Il reste " + missing + " question" + (missing > 1 ? "s" : "") + " sans réponse. Répondez à toutes les questions, même si vous n’êtes pas sûr."; err.hidden = false; return; }
    renderResult(score(state.test, state.answers));
  }

  function renderResult(s){
    var t = TESTS[state.test], v = VERDICTS[s.r];
    var payload = { v: 1, t: state.test, n: state.who.nom, e: state.who.email, p: state.who.tel, s: s.pct, d: s.per, r: s.r, at: new Date().toISOString() };
    var code = makeCode(payload);
    var bars = Object.keys(t.domains).map(function(d){
      var p = s.per[d], w = Math.round(p[0] / p[1] * 100);
      return '<div class="bar-row"><span>' + esc(t.domains[d]) + '</span><div class="bar" role="img" aria-label="' + p[0] + ' sur ' + p[1] + '"><span style="width:' + w + '%"></span></div><span class="v">' + p[0] + ' / ' + p[1] + '</span></div>';
    }).join("");
    app.innerHTML =
      '<section class="card" aria-labelledby="res-h"><h2 id="res-h">Votre résultat, ' + esc(state.who.nom.split(" ")[0]) + '</h2>' +
      '<div class="score"><span class="big">' + s.pct + ' %</span><span class="of">' + s.ok + ' bonnes réponses sur ' + s.total + '</span></div>' +
      '<p class="verdict ' + v[0] + '">' + esc(v[1]) + '</p><div class="bars">' + bars + '</div></section>' +
      '<section class="card" aria-labelledby="code-h"><h2 id="code-h">Envoyez votre code à IAM</h2>' +
      '<p style="margin:0">Ce code contient votre résultat. Copiez-le et envoyez-le à IAM pour finaliser votre orientation et votre inscription.</p>' +
      '<div class="code" id="code">' + esc(code) + '</div>' +
      '<div class="submit-row"><button class="btn primary" type="button" id="copy">Copier le code</button><span class="hint" id="copied" aria-live="polite"></span></div>' +
      '<ol class="steps"><li>Envoyez le code par WhatsApp au <strong>[numéro IAM]</strong> ou par e-mail à <strong>[adresse IAM]</strong>.</li><li>IAM vous confirme votre parcours sous 48 h ouvrées.</li><li>Vous réglez votre inscription par Orange Money, Wave ou sur place à IAM.</li></ol></section>' +
      '<p class="hint">Les bonnes réponses ne sont pas affichées : elles seront travaillées pendant le parcours.</p>';
    document.getElementById("copy").addEventListener("click", function(){
      var msg = document.getElementById("copied");
      try {
        navigator.clipboard.writeText(code).then(function(){ msg.textContent = "Code copié."; }, selectCode);
      } catch (e) { selectCode(); }
      function selectCode(){ var r = document.createRange(); r.selectNodeContents(document.getElementById("code")); var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); msg.textContent = "Code sélectionné : copiez-le avec votre appareil."; }
    });
    window.scrollTo(0, 0);
  }

  function route(){ var h = (location.hash || "").replace("#", ""); if (TESTS[h]) renderTest(h); else renderChoose(); }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
